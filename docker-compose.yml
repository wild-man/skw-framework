  skw-redis:
    image: redis:latest
    container_name: skw-redis
    tty: true
    stdin_open: true
    environment:
      - REDIS_PASSWORD=password
      - REDIS_USER=skw
      - REDIS_USER_PASSWORD=password
    ports:
      - "6381:6379"
    volumes:
      - ./docker/redis:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ./conf/redis.users.acl:/usr/local/etc/redis/users.acl
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
    networks:
      - main
    restart: unless-stopped

  #NETWORK
networks:
  main-static:
    ipam:
      driver: default
      config:
        - subnet: "172.16.238.0/24"
        - subnet: "2001:3984:3989::/64"
  main:
    driver: bridge

  # VOLUMES
volumes:
  # minio_data:
  #   driver: local
  pgdata:
